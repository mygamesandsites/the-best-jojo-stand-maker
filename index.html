<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand Maker</title>
<meta name="description" content="Crie seu próprio Stand de JoJo's Bizarre Adventure com Atos ilimitados, Sub-Stands, gráfico de status, eyecatch e exportação em PNG.">
<meta name="keywords" content="jojo stand maker, criador de stand, jojo bizarre adventure, stand stats generator, fan stand, rpg jojo">
<meta property="og:title" content="The Best JoJo Stand Maker">
<meta property="og:description" content="Crie fichas completas de Stand com Atos ilimitados, Sub-Stands, gráfico hexagonal e exportação em PNG.">
<meta property="og:url" content="https://github.io">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ef4444">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
html,body{
  width:100%;height:100%;background:#090710;
  color:#f8fafc;overflow:hidden
}
#app{
  display:flex;flex-direction:column;
  width:100%;height:100%;padding:10px;
  transform-origin:top left
}
.top{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:8px;
  flex-shrink:0;gap:6px
}
h1{
  color:#facc15;font-size:18px;letter-spacing:2px;
  cursor:pointer;user-select:none
}
.zb{
  display:flex;align-items:center;gap:4px;
  background:#141024;padding:3px 6px;
  border-radius:4px;border:1px solid #3b2868
}
.zb span{
  font-size:11px;font-weight:bold;
  min-width:36px;text-align:center;color:#facc15
}
.g{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;flex:1;min-height:0
}
@media(max-width:650px){
  .g{grid-template-columns:1fr;overflow-y:auto}
}
.bx{
  background:#141024;border:1px solid #3b2868;
  border-radius:8px;padding:12px;
  display:flex;flex-direction:column;overflow-y:auto
}
label{
  display:block;font-size:10px;color:#a78bfa;
  margin:5px 0 2px;text-transform:uppercase;
  font-weight:bold
}
input,textarea,select{
  width:100%;background:#090710;
  border:1px solid #4c3585;color:#fff;
  padding:5px 6px;border-radius:4px;font-size:12px
}
.r{display:flex;gap:6px;align-items:center}
.ac{
  display:flex;gap:4px;flex-wrap:wrap;
  margin-bottom:4px
}
button{
  padding:5px 9px;border:none;border-radius:4px;
  font-weight:bold;cursor:pointer;font-size:11px;
  color:#fff;background:#3b2868
}
button.on{background:#ef4444}
.st{
  display:grid;grid-template-columns:1fr 1fr;
  gap:5px;margin-top:4px
}
.si{
  display:flex;justify-content:space-between;
  align-items:center;background:#090710;
  padding:4px 8px;border-radius:4px;
  border-left:3px solid #facc15;
  font-size:11px;font-weight:bold
}
.si select{width:46px;padding:2px;color:#facc15}
.vs{
  display:flex;align-items:center;
  justify-content:space-evenly;gap:8px;
  margin:auto 0;padding:6px 0;flex-wrap:wrap
}
.iw{
  width:36%;max-width:190px;aspect-ratio:3/4;
  border:1px dashed #4c3585;border-radius:6px;
  display:flex;align-items:center;
  justify-content:center;overflow:hidden;
  background:#090710
}
.iw img{
  width:100%;height:100%;
  object-fit:cover;display:none
}
.cw{
  width:56%;max-width:260px;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center
}
canvas{width:100%;height:100%}
.ab{
  background:#090710;border-left:3px solid #ef4444;
  padding:8px;font-size:12px;min-height:50px;
  margin-top:auto
}
.sb-box{
  margin-top:6px;padding-top:6px;
  border-top:1px dashed #3b2868;display:none
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1 id="logo">STAND MAKER</h1>
    <div class="r">
      <label id="wmWrap" style="display:none;margin:0;
        font-size:9px;color:#64748b;cursor:pointer">
        <input type="checkbox" id="wm" checked
          style="width:auto;vertical-align:middle"> WM
      </label>
      <button id="lg" style="background:#1e1b4b;
        border:1px solid #facc15;color:#facc15">PT</button>
      <div class="zb">
        <button id="zo">-</button>
        <span id="zv">100%</span>
        <button id="zi">+</button>
        <button id="zr" style="background:#1e1b4b;
          color:#a78bfa">100%</button>
      </div>
    </div>
  </div>
  <div class="g">
    <div class="bx">
      <div class="r" style="justify-content:space-between">
        <label style="margin:0">
          <span id="la">Atos</span> (<span id="cn">1</span>)
        </label>
        <div class="r">
          <button id="ad" style="background:#16a34a">+ Ato</button>
          <button id="dl" style="background:#991b1b">X</button>
          <button id="cl" style="background:#450a0a">Limpar</button>
        </div>
      </div>
      <div class="ac" id="ab" style="margin-top:5px"></div>
      <div class="r">
        <div style="flex:1">
          <label id="lt">Nome do Ato</label><input id="t">
        </div>
        <div style="flex:1.5">
          <label id="ln">Nome do Stand</label><input id="n">
        </div>
        <div style="flex:0.5">
          <label id="lu">Aura</label>
          <input type="color" id="au" value="#ef4444"
            style="height:27px;padding:1px">
        </div>
      </div>
      <div class="r">
        <div style="flex:1">
          <label id="ls">Usuário</label><input id="u">
        </div>
        <div style="flex:1">
          <label id="lc">Grito</label><input id="c">
        </div>
      </div>
      <div class="r">
        <div style="flex:1">
          <label id="li">Imagem</label>
          <input type="file" id="ii" accept="image/*">
        </div>
        <div style="flex:1">
          <label id="lsub">Sub-Stand</label><input id="sn">
        </div>
      </div>
      <label id="lb">Habilidade</label>
      <textarea id="a" rows="2"></textarea>
      <label id="lsb">Habilidade Sub-Stand</label>
      <input id="sa">
      <label>Stand Stats</label>
      <div class="st" id="sb"></div>
      <div class="r" style="margin-top:auto;padding-top:8px">
        <button id="rn" style="flex:1;background:#7e22ce">Sortear</button>
        <button id="pn" style="flex:1;background:#d97706">PNG</button>
        <button id="sv" style="flex:1;background:#16a34a">Salvar</button>
        <button id="ld" style="flex:1;background:#2563eb">Carregar</button>
        <input type="file" id="lf" accept=".json" style="display:none">
      </div>
    </div>
    <div class="bx">
      <div style="text-align:center">
        <small id="dt" style="font-weight:bold"></small>
        <h2 id="dn" style="color:#facc15;font-size:20px">「」</h2>
        <small id="du" style="color:#cbd5e1"></small>
      </div>
      <div class="vs">
        <div class="iw" id="ib">
          <img id="pi">
          <span id="ni" style="font-size:10px;color:#64748b">
            Sem imagem
          </span>
        </div>
        <div class="cw">
          <canvas id="cv" width="240" height="240"></canvas>
        </div>
      </div>
      <div class="ab" id="ax">
        <b id="dc" style="color:#facc15"></b>
        <p id="da" style="margin-top:3px"></p>
        <div class="sb-box" id="dsBox">
          <b id="dsn" style="color:#a78bfa;font-size:11px"></b>
          <p id="dsa" style="font-size:11px;margin-top:2px"></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = i => document.getElementById(i);
const tx = {
  pt: {
    a:'Atos', ad:'+ Ato', cl:'Limpar', t:'Nome do Ato',
    n:'Nome do Stand', au:'Aura', u:'Usuário',
    up:'Usuário: ', i:'Imagem', ni:'Sem imagem',
    c:'Grito', b:'Habilidade', sub:'Sub-Stand',
    sb:'Habilidade Sub-Stand', rn:'Sortear',
    sv:'Salvar', ld:'Carregar',
    k:['PODER','VELOCIDADE','ALCANCE',
       'PERSISTÊNCIA','PRECISÃO','POTENCIAL'],
    s:['POD','VEL','ALC','PER','PRE','POT']
  },
  en: {
    a:'Acts', ad:'+ Act', cl:'Reset', t:'Act Name',
    n:'Stand Name', au:'Aura', u:'Stand User',
    up:'User: ', i:'Image', ni:'No image',
    c:'Battle Cry', b:'Ability', sub:'Sub-Stand',
    sb:'Sub-Stand Ability', rn:'Random',
    sv:'Save', ld:'Load',
    k:['POWER','SPEED','RANGE',
       'STAMINA','PRECISION','POTENTIAL'],
    s:['PWR','SPD','RNG','STA','PRC','POT']
  }
};
const mp = {'∞':6.6,S:6,A:5,B:4,C:3,D:2,E:1,'?':0};
const rk = ['?','∞','S','A','B','C','D','E'];
const db = 'sm_v3';
const mk = i => ({
  t:`ACT ${i}`, n:'', c:'', a:'', sn:'', sa:'',
  au:'#ef4444', img:'', s:['?','?','?','?','?','?']
});
let l = 'pt', ac = [mk(1)], c = 0, z = 1, taps = 0;

$('logo').onclick = () => {
  taps++;
  if(taps >= 3) {
    const w = $('wmWrap');
    w.style.display = w.style.display === 'none'
      ? 'inline' : 'none';
    taps = 0;
  }
};

function zm(v) {
  z = Math.min(1.5, Math.max(0.3, +(v.toFixed(2))));
  const e = $('app');
  e.style.transform = `scale(${z})`;
  e.style.width = `${100/z}%`;
  e.style.height = `${100/z}%`;
  $('zv').textContent = `${Math.round(z*100)}%`;
}
$('zo').onclick = () => zm(z-0.1);
$('zi').onclick = () => zm(z+0.1);
$('zr').onclick = () => zm(1);

function ui() {
  const L = tx[l];
  $('lg').textContent = l.toUpperCase();
  $('la').textContent = L.a;
  $('ad').textContent = L.ad;
  $('cl').textContent = L.cl;
  $('lt').textContent = L.t;
  $('ln').textContent = L.n;
  $('lu').textContent = L.au;
  $('ls').textContent = L.u;
  $('li').textContent = L.i;
  $('ni').textContent = L.ni;
  $('lc').textContent = L.c;
  $('lb').textContent = L.b;
  $('lsub').textContent = L.sub;
  $('lsb').textContent = L.sb;
  $('rn').textContent = L.rn;
  $('sv').textContent = L.sv;
  $('ld').textContent = L.ld;
  const opts = rk.map(r => `<option>${r}</option>`).join('');
  $('sb').innerHTML = L.k.map((k,i) =>
    `<div class="si"><span>${k}</span>` +
    `<select id="s${i}">${opts}</select></div>`
  ).join('');
  L.k.forEach((_,i) => $('s'+i).onchange = sa);
  ac[c].s.forEach((v,i) => $('s'+i).value = v);
  rn();
}

function ps() {
  try {
    const data = JSON.stringify({l, u:$('u').value, ac, c});
    localStorage.setItem(db, data);
  } catch(e) {}
}

function la(i) {
  c = i;
  $('cn').textContent = ac.length;
  $('ab').innerHTML = ac.map((x,j) => {
    const nm = (x.t||`ACT ${j+1}`).toUpperCase();
    const cls = j===c ? 'on' : '';
    return `<button class="${cls}" ` +
      `onclick="la(${j})">${nm}</button>`;
  }).join('');
  const d = ac[c];
  $('t').value = d.t;
  $('n').value = d.n;
  $('c').value = d.c;
  $('a').value = d.a;
  $('sn').value = d.sn || '';
  $('sa').value = d.sa || '';
  $('au').value = d.au;
  $('ii').value = '';
  d.s.forEach((v,j) => $('s'+j).value = v);
  ps();
  rn();
}

function sa() {
  const d = ac[c];
  d.t = $('t').value;
  d.n = $('n').value;
  d.c = $('c').value;
  d.a = $('a').value;
  d.sn = $('sn').value;
  d.sa = $('sa').value;
  d.au = $('au').value;
  d.s = tx[l].k.map((_,i) => $('s'+i).value);
  const nm = (d.t||`ACT ${c+1}`).toUpperCase();
  $('ab').children[c].textContent = nm;
  ps();
  rn();
}
  function dr(x, cx, cy, mr, d) {
  x.save();
  x.beginPath();
  x.arc(cx, cy, mr + 14, 0, Math.PI * 2);
  x.strokeStyle = 'rgba(250, 204, 21, 0.35)';
  x.lineWidth = 2;
  x.stroke();

  x.beginPath();
  x.arc(cx, cy, mr + 10, 0, Math.PI * 2);
  x.setLineDash([4, 4]);
  x.strokeStyle = d.au;
  x.lineWidth = 1.5;
  x.stroke();
  x.setLineDash([]);

  for(let i=0; i<6; i++) {
    let a = i*Math.PI/3 - Math.PI/2;
    x.beginPath();
    x.moveTo(cx, cy);
    x.lineTo(cx + mr*Math.cos(a), cy + mr*Math.sin(a));
    x.strokeStyle = 'rgba(255,255,255,0.12)';
    x.stroke();
  }
  x.restore();

  for(let v=1; v<=6; v++) {
    x.beginPath();
    for(let i=0; i<6; i++) {
      let a = i*Math.PI/3 - Math.PI/2;
      let r = (mr/6)*v;
      let px = cx + r*Math.cos(a);
      let py = cy + r*Math.sin(a);
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.closePath();
    x.strokeStyle = v==6
      ? '#facc15' : 'rgba(255,255,255,0.2)';
    x.lineWidth = v==6 ? 1.5 : 1;
    x.stroke();
  }
  x.beginPath();
  d.s.forEach((k,i) => {
    let a = i*Math.PI/3 - Math.PI/2;
    let r = (mr/6)*(mp[k]||0);
    let px = cx + r*Math.cos(a);
    let py = cy + r*Math.sin(a);
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  });
  x.closePath();
  x.fillStyle = d.au + '66';
  x.fill();
  x.strokeStyle = d.au;
  x.lineWidth = 2.5;
  x.stroke();
  x.textAlign = 'center';
  tx[l].s.forEach((k,i) => {
    let a = i*Math.PI/3 - Math.PI/2;
    let lx = cx + (mr+25)*Math.cos(a);
    let ly = cy + (mr+25)*Math.sin(a);
    x.fillStyle = '#cbd5e1';
    x.font = 'bold 9px sans-serif';
    x.fillText(k, lx, ly-5);
    const val = d.s[i];
    x.fillStyle = (val=='S'||val=='∞')
      ? '#ef4444' : '#facc15';
    x.font = '900 13px sans-serif';
    x.fillText(val, lx, ly+9);
  });
}

function rn() {
  const L = tx[l];
  const d = ac[c];
  const tg = (d.t||`ACT ${c+1}`).toUpperCase();
  $('dt').textContent = tg;
  $('dt').style.color = d.au;
  $('dn').textContent = d.n
    ? `「${d.n.toUpperCase()}」` : `「${tg}」`;
  $('du').textContent = $('u').value
    ? `${L.up}${$('u').value}` : '';
  $('dc').textContent = d.c.toUpperCase();
  $('da').textContent = d.a;
  $('ax').style.borderColor = d.au;

  const hasSub = !!(d.sn || d.sa);
  $('dsBox').style.display = hasSub ? 'block' : 'none';
  $('dsn').textContent = d.sn
    ? `SUB-STAND: 「${d.sn.toUpperCase()}」` : '';
  $('dsa').textContent = d.sa || '';

  $('pi').style.display = d.img ? 'block' : 'none';
  $('ni').style.display = d.img ? 'none' : 'block';
  if(d.img) $('pi').src = d.img;
  $('ib').style.borderColor = d.img ? d.au : '#4c3585';
  $('ib').style.boxShadow = d.img
    ? `0 0 15px ${d.au}66` : 'none';
  const x = $('cv').getContext('2d');
  x.clearRect(0,0,240,240);
  dr(x, 120, 120, 74, d);
}

$('pn').onclick = () => {
  const d = ac[c];
  const L = tx[l];
  const tg = (d.t||`ACT ${c+1}`).toUpperCase();
  const hasSub = !!(d.sn || d.sa);
  const cv = document.createElement('canvas');
  cv.width = 640;
  cv.height = hasSub ? 520 : 470;
  const x = cv.getContext('2d');
  x.fillStyle = '#090710';
  x.fillRect(0,0,640,cv.height);
  x.strokeStyle = d.au;
  x.lineWidth = 4;
  x.strokeRect(8,8,624,cv.height-16);
  x.textAlign = 'center';
  x.fillStyle = d.au;
  x.font = 'bold 14px sans-serif';
  x.fillText(tg, 320, 38);
  x.fillStyle = '#facc15';
  x.font = '900 26px sans-serif';
  x.fillText(d.n ? `「${d.n.toUpperCase()}」` : `「${tg}」`, 320, 68);
  x.fillStyle = '#cbd5e1';
  x.font = '14px sans-serif';
  if($('u').value) x.fillText(`${L.up}${$('u').value}`, 320, 90);
  x.strokeStyle = '#3b2868';
  x.lineWidth = 2;
  x.strokeRect(40,115,180,220);
  if(d.img) {
    x.drawImage($('pi'), 40, 115, 180, 220);
  } else {
    x.fillStyle = '#64748b';
    x.font = '12px sans-serif';
    x.fillText(L.ni, 130, 225);
  }
  dr(x, 440, 225, 76, d);

  const boxH = hasSub ? 125 : 80;
  x.fillStyle = '#141024';
  x.fillRect(40,355,560,boxH);
  x.fillStyle = d.au;
  x.fillRect(40,355,5,boxH);
  x.textAlign = 'left';
  x.fillStyle = '#facc15';
  x.font = 'bold 14px sans-serif';
  x.fillText(d.c.toUpperCase(), 55, 378);
  x.fillStyle = '#f8fafc';
  x.font = '13px sans-serif';
  let ln = '', y = 398;
  d.a.split(' ').forEach(w => {
    if(x.measureText(ln+w).width > 530) {
      x.fillText(ln, 55, y);
      ln = w + ' ';
      y += 17;
    } else {
      ln += w + ' ';
    }
  });
  x.fillText(ln, 55, y);

  if(hasSub) {
    y += 22;
    x.fillStyle = '#a78bfa';
    x.font = 'bold 12px sans-serif';
    const st = d.sn
      ? `SUB-STAND: 「${d.sn.toUpperCase()}」` : 'SUB-STAND';
    x.fillText(st, 55, y);
    y += 16;
    x.fillStyle = '#cbd5e1';
    x.font = '12px sans-serif';
    x.fillText(d.sa || '', 55, y);
  }

  if($('wm').checked) {
    x.textAlign = 'right';
    x.fillStyle = 'rgba(255,255,255,0.28)';
    x.font = '10px sans-serif';
    x.fillText(
      'mygamesandsites.github.io/the-best-jojo-stand-maker',
      615, cv.height - 16
    );
  }

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  const fn = (d.n||tg).toLowerCase().replace(/\s+/g,'-');
  a.download = `${fn}.png`;
  a.click();
};

$('lg').onclick = () => {
  l = l==='pt' ? 'en' : 'pt';
  ps();
  ui();
};
$('ad').onclick = () => {
  ac.push(mk(ac.length+1));
  la(ac.length-1);
};
$('dl').onclick = () => {
  if(ac.length>1) {
    ac.splice(c,1);
    la(Math.max(0,c-1));
  }
};
$('cl').onclick = () => {
  localStorage.removeItem(db);
  $('u').value = '';
  ac = [mk(1)];
  la(0);
};
['t','n','u','c','a','sn','sa','au']
  .forEach(i => $(i).oninput = sa);

$('ii').onchange = e => {
  const f = e.target.files.item(0);
  if(!f) return;
  const r = new FileReader();
  r.onload = v => {
    ac[c].img = v.target.result;
    ps();
    rn();
  };
  r.readAsDataURL(f);
};

$('rn').onclick = () => {
  const p = ['∞','S','A','B','C','D','E'];
  tx[l].k.forEach((_,i) => {
    $('s'+i).value = p[Math.floor(Math.random()*p.length)];
  });
  sa();
};

$('sv').onclick = () => {
  const blob = new Blob(
    [JSON.stringify({u:$('u').value, ac})],
    {type:'application/json'}
  );
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const base = ac.at(0)?.n || 'stand';
  const fn = base.toLowerCase().replace(/\s+/g,'-');
  a.download = `${fn}.json`;
  a.click();
};

$('ld').onclick = () => $('lf').click();
$('lf').onchange = e => {
  const f = e.target.files.item(0);
  if(!f) return;
  const r = new FileReader();
  r.onload = v => {
    const p = JSON.parse(v.target.result);
    const list = p.ac || p.acts;
    if(list?.length) {
      $('u').value = p.u || p.user || '';
      ac = list;
      la(0);
    }
  };
  r.readAsText(f);
};

try {
  const p = JSON.parse(localStorage.getItem(db));
  if(p) {
    if(p.l) l = p.l;
    if(p.u) $('u').value = p.u;
    if(p.ac?.length) ac = p.ac;
    c = Math.min(p.c||0, ac.length-1);
  }
} catch(e) {}
ui();
la(c);
</script>
</body>
</html>
