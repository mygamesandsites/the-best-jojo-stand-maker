<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand Maker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
html,body{width:100%;height:100%;background:#090710;color:#f8fafc;overflow:hidden}
#app{display:flex;flex-direction:column;width:100%;height:100%;padding:10px;transform-origin:top left}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-shrink:0}
h1{color:#facc15;font-size:18px;letter-spacing:2px}
.z-bar{display:flex;align-items:center;gap:4px;background:#141024;padding:3px 6px;border-radius:4px;border:1px solid #3b2868}
.z-bar span{font-size:11px;font-weight:bold;min-width:36px;text-align:center;color:#facc15}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
@media(max-width:650px){.grid{grid-template-columns:1fr;overflow-y:auto}}
.box{background:#141024;border:1px solid #3b2868;border-radius:8px;padding:12px;display:flex;flex-direction:column;overflow-y:auto}
label{display:block;font-size:10px;color:#a78bfa;margin:6px 0 2px;text-transform:uppercase;font-weight:bold}
input,textarea,select{width:100%;background:#090710;border:1px solid #4c3585;color:#fff;padding:6px;border-radius:4px;font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.acts{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
button{padding:5px 9px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:11px;color:#fff;background:#3b2868}
button.active{background:#ef4444}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.st{display:flex;justify-content:space-between;align-items:center;background:#090710;padding:4px 8px;border-radius:4px;border-left:3px solid #facc15;font-size:11px;font-weight:bold}
.st select{width:46px;padding:2px;color:#facc15}
.vis{display:flex;align-items:center;justify-content:space-evenly;gap:8px;margin:auto 0;padding:8px 0;flex-wrap:wrap}
.img-wrap{width:38%;max-width:200px;aspect-ratio:3/4;border:1px dashed #4c3585;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#090710}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:none}
.cv-wrap{width:55%;max-width:260px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%}
.ab{background:#090710;border-left:3px solid #ef4444;padding:8px;font-size:12px;min-height:55px;margin-top:auto}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>STAND MAKER</h1>
    <div class="z-bar">
      <button id="zOut">-</button>
      <span id="zVal">100%</span>
      <button id="zIn">+</button>
      <button id="zReset" style="background:#1e1b4b;color:#a78bfa">100%</button>
    </div>
  </div>
  <div class="grid">
    <div class="box">
      <div class="row" style="justify-content:space-between">
        <label style="margin:0">Atos (<span id="actCount">1</span>)</label>
        <div class="row">
          <button id="addAct" style="background:#16a34a">+ Ato</button>
          <button id="delAct" style="background:#991b1b">X</button>
        </div>
      </div>
      <div class="acts" id="actBar" style="margin-top:5px"></div>

      <div class="row">
        <div style="flex:1"><label>Nome do Ato</label><input id="t"></div>
        <div style="flex:1.5"><label>Nome do Stand</label><input id="n"></div>
        <div style="flex:0.5"><label>Aura</label><input type="color" id="au" value="#ef4444" style="height:29px;padding:1px"></div>
      </div>
      <label>Usuário</label><input id="u">
      <div class="row">
        <div style="flex:2"><label>Imagem</label><input type="file" id="imgIn" accept="image/*"></div>
        <div style="flex:1"><label>Grito</label><input id="c"></div>
      </div>
      <label>Habilidade</label><textarea id="a" rows="2"></textarea>
      <label>Stand Stats</label>
      <div class="stats" id="sBox"></div>
      <div class="row" style="margin-top:auto;padding-top:8px">
        <button id="rnd" style="flex:1;background:#7e22ce">Sortear</button>
        <button id="saveFile" style="flex:1;background:#16a34a">Salvar</button>
        <button id="loadBtn" style="flex:1;background:#2563eb">Carregar</button>
        <input type="file" id="loadFile" accept=".json" style="display:none">
      </div>
    </div>

    <div class="box">
      <div style="text-align:center">
        <small id="dt" style="font-weight:bold"></small>
        <h2 id="dn" style="color:#facc15;font-size:20px">「」</h2>
        <small id="du" style="color:#cbd5e1"></small>
      </div>
      <div class="vis">
        <div class="img-wrap" id="iBox">
          <img id="prevImg">
          <span id="noImg" style="font-size:10px;color:#64748b">Sem imagem</span>
        </div>
        <div class="cv-wrap">
          <canvas id="cv" width="240" height="240"></canvas>
        </div>
      </div>
      <div class="ab" id="abBox"><b id="dc" style="color:#facc15"></b><p id="da" style="margin-top:4px"></p></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const keys = ['PODER','VELOCIDADE','ALCANCE','PERSISTÊNCIA','PRECISÃO','POTENCIAL'];
const short = ['POD','VEL','ALC','PER','PRE','POT'];
const map = {S:6,A:5,B:4,C:3,D:2,E:1,'?':0};
const rks = ['?','S','A','B','C','D','E'];

const newAct = i => ({t:`ACT ${i}`,n:'',c:'',a:'',au:'#ef4444',img:'',s:['?','?','?','?','?','?']});
let acts = [newAct(1)], cur = 0, scale = 1;

function setZoom(s) {
  scale = Math.min(1.5, Math.max(0.3, +(s.toFixed(2))));
  const app = $('app');
  app.style.transform = `scale(${scale})`;
  app.style.width = `${100 / scale}%`;
  app.style.height = `${100 / scale}%`;
  $('zVal').textContent = `${Math.round(scale * 100)}%`;
}

$('zOut').onclick = () => setZoom(scale - 0.1);
$('zIn').onclick = () => setZoom(scale + 0.1);
$('zReset').onclick = () => setZoom(1);

keys.forEach((k,i) => {
  $('sBox').innerHTML += `<div class="st"><span>${k}</span><select id="s${i}">${rks.map(r=>`<option>${r}</option>`).join('')}</select></div>`;
});

function loadAct(i) {
  cur = i;
  $('actCount').textContent = acts.length;
  $('actBar').innerHTML = acts.map((act,idx) =>
    `<button class="${idx===cur?'active':''}" onclick="loadAct(${idx})">${(act.t||`ACT ${idx+1}`).toUpperCase()}</button>`
  ).join('');
  const d = acts[cur];
  $('t').value = d.t; $('n').value = d.n; $('c').value = d.c; $('a').value = d.a; $('au').value = d.au;
  $('imgIn').value = '';
  d.s.forEach((v,idx) => $('s'+idx).value = v);
  render();
}

function saveAct() {
  const d = acts[cur];
  d.t = $('t').value; d.n = $('n').value; d.c = $('c').value; d.a = $('a').value; d.au = $('au').value;
  d.s = keys.map((_,i) => $('s'+i).value);
  $('actBar').children[cur].textContent = (d.t||`ACT ${cur+1}`).toUpperCase();
  render();
}

function render() {
  const d = acts[cur], tag = (d.t||`ACT ${cur+1}`).toUpperCase();
  $('dt').textContent = tag; $('dt').style.color = d.au;
  $('dn').textContent = d.n ? `「${d.n.toUpperCase()}」` : `「${tag}」`;
  $('du').textContent = $('u').value ? `Usuário: ${$('u').value}` : '';
  $('dc').textContent = d.c.toUpperCase();
  $('da').textContent = d.a;
  $('abBox').style.borderColor = d.au;

  $('prevImg').style.display = d.img ? 'block' : 'none';
  $('noImg').style.display = d.img ? 'none' : 'block';
  if(d.img) $('prevImg').src = d.img;
  $('iBox').style.borderColor = d.img ? d.au : '#4c3585';

  const ctx = $('cv').getContext('2d'), cx = 120, cy = 120, maxR = 80;
  ctx.clearRect(0,0,240,240);

  for(let l=1; l<=6; l++) {
    ctx.beginPath();
    for(let i=0; i<6; i++) {
      let a = i*Math.PI/3 - Math.PI/2, r = (maxR/6)*l;
      i ? ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a)) : ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
    }
    ctx.closePath();
    ctx.strokeStyle = l==6 ? '#facc15' : 'rgba(255,255,255,0.2)';
    ctx.stroke();
  }

  ctx.beginPath();
  d.s.forEach((rk,i) => {
    let a = i*Math.PI/3 - Math.PI/2, r = (maxR/6)*(map[rk]||0);
    i ? ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a)) : ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
  });
  ctx.closePath(); ctx.fillStyle = d.au+'66'; ctx.fill(); ctx.strokeStyle = d.au; ctx.lineWidth = 2.5; ctx.stroke();

  ctx.textAlign = 'center';
  short.forEach((k,i) => {
    let a = i*Math.PI/3 - Math.PI/2, lx = cx+100*Math.cos(a), ly = cy+100*Math.sin(a);
    ctx.fillStyle = '#cbd5e1'; ctx.font = 'bold 10px sans-serif'; ctx.fillText(k, lx, ly-5);
    ctx.fillStyle = d.s[i]=='S' ? '#ef4444' : '#facc15'; ctx.font = '900 13px sans-serif'; ctx.fillText(d.s[i], lx, ly+10);
  });
}

$('addAct').onclick = () => { acts.push(newAct(acts.length+1)); loadAct(acts.length-1); };
$('delAct').onclick = () => { if(acts.length>1){ acts.splice(cur,1); loadAct(Math.max(0,cur-1)); } };

['t','n','u','c','a','au'].forEach(id => $(id).oninput = saveAct);
keys.forEach((_,i) => $('s'+i).onchange = saveAct);

$('imgIn').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => { acts[cur].img = ev.target.result; render(); };
  r.readAsDataURL(f);
};

$('rnd').onclick = () => {
  const pool = ['S','A','B','C','D','E'];
  keys.forEach((_,i) => $('s'+i).value = pool[Math.floor(Math.random()*6)]);
  saveAct();
};

$('saveFile').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({user:$('u').value,acts})],{type:'application/json'}));
  a.download = `${(acts[0].n||'stand').toLowerCase().replace(/\s+/g,'-')}.json`;
  a.click();
};

$('loadBtn').onclick = () => $('loadFile').click();
$('loadFile').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const p = JSON.parse(ev.target.result);
    if(p.acts?.length){ $('u').value = p.user||''; acts = p.acts; loadAct(0); }
  };
  r.readAsText(f);
};

loadAct(0);
</script>
</body>
</html>
