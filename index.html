<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Best JoJo Stand Maker</title>
<style>
:root{
  --bg:#090710;--pn:#141024;--c1:#facc15;
  --c2:#a78bfa;--tx:#f8fafc;--bd:#3b2868
}
*{
  box-sizing:border-box;margin:0;padding:0;
  font-family:sans-serif;scrollbar-color:var(--bd) var(--bg)
}
html,body{
  width:100%;height:100%;background:var(--bg);
  color:var(--tx);overflow:hidden
}
#app{
  display:flex;flex-direction:column;
  width:100%;height:100%;padding:10px;
  transform-origin:top left
}
.top{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:6px;
  flex-shrink:0;gap:6px
}
h1{
  color:var(--c1);font-size:18px;letter-spacing:2px;
  cursor:pointer;user-select:none
}
.zb,.th-bar{
  display:flex;align-items:center;gap:4px;
  background:var(--pn);padding:3px 6px;
  border-radius:4px;border:1px solid var(--bd)
}
.th-bar{margin-bottom:6px;justify-content:space-around;flex-wrap:wrap}
.th-it{
  display:flex;align-items:center;gap:3px;
  font-size:10px;font-weight:bold;color:var(--c2)
}
.th-it input{width:24px;height:20px;padding:0;border:none;cursor:pointer}
.zb span{
  font-size:11px;font-weight:bold;
  min-width:36px;text-align:center;color:var(--c1)
}
.g{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;flex:1;min-height:0
}
@media(max-width:650px){
  .g{grid-template-columns:1fr;overflow-y:auto}
}
.bx{
  background:var(--pn);border:1px solid var(--bd);
  border-radius:8px;padding:12px;
  display:flex;flex-direction:column;overflow-y:auto
}
label{
  display:block;font-size:10px;color:var(--c2);
  margin:5px 0 2px;text-transform:uppercase;
  font-weight:bold
}
input,textarea,select{
  width:100%;background:var(--bg);
  border:1px solid var(--bd);color:var(--tx);
  padding:5px 6px;border-radius:4px;font-size:12px
}
.r{display:flex;gap:6px;align-items:center}
.ac{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
button{
  padding:5px 8px;border:1px solid transparent;border-radius:4px;
  font-weight:bold;cursor:pointer;font-size:11px;
  color:var(--tx);background:var(--bd)
}
button.on{background:#ef4444;color:#fff;border-color:var(--c1)}
.st{
  display:grid;grid-template-columns:1fr 1fr;
  gap:5px;margin-top:4px
}
.si{
  display:flex;justify-content:space-between;
  align-items:center;background:var(--bg);
  padding:4px 8px;border-radius:4px;
  border-left:3px solid var(--c1);
  font-size:11px;font-weight:bold;color:var(--tx)
}
.si select{width:46px;padding:2px;color:var(--c1)}
.vs{
  display:flex;align-items:center;
  justify-content:space-evenly;gap:8px;
  margin:auto 0;padding:6px 0;flex-wrap:wrap
}
.iw{
  width:36%;max-width:190px;aspect-ratio:3/4;
  border:1px dashed var(--bd);border-radius:6px;
  display:flex;align-items:center;
  justify-content:center;overflow:hidden;
  background:var(--bg)
}
.iw img{width:100%;height:100%;object-fit:cover;display:none}
.cw{
  width:56%;max-width:260px;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center
}
canvas{width:100%;height:100%}
.ab{
  background:var(--bg);border-left:3px solid #ef4444;
  padding:8px;font-size:12px;min-height:50px;
  margin-top:auto;word-break:break-word;color:var(--tx)
}
.sb-box{
  margin-top:6px;padding-top:6px;
  border-top:1px dashed var(--bd);display:none
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1 id="logo">STAND MAKER</h1>
    <div class="r">
      <label id="wmWrap" style="display:none;margin:0;
        font-size:9px;color:var(--c2);cursor:pointer">
        <input type="checkbox" id="wm" checked
          style="width:auto;vertical-align:middle"> WM
      </label>
      <button id="thBtn" style="border-color:var(--c1);
        color:var(--c1)">🎨</button>
      <button id="lg" style="border-color:var(--c1);
        color:var(--c1)">PT</button>
      <div class="zb">
        <button id="zo">-</button>
        <span id="zv">100%</span>
        <button id="zi">+</button>
        <button id="zr" style="color:var(--c2)">100%</button>
      </div>
    </div>
  </div>
  <div class="th-bar" id="thBar" style="display:none">
    <div class="th-it"><span id="ltBg">Fundo</span><input type="color" id="thBg"></div>
    <div class="th-it"><span id="ltPn">Painel</span><input type="color" id="thPn"></div>
    <div class="th-it"><span id="ltC1">Destaque</span><input type="color" id="thC1"></div>
    <div class="th-it"><span id="ltC2">Secundária</span><input type="color" id="thC2"></div>
    <div class="th-it"><span id="ltTx">Texto</span><input type="color" id="thTx"></div>
    <div class="th-it"><span id="ltBd">Borda</span><input type="color" id="thBd"></div>
    <button id="thRst" style="background:#991b1b;color:#fff;font-size:10px;padding:3px 6px">Reset</button>
  </div>
  <div class="g">
    <div class="bx">
      <div class="r" style="justify-content:space-between">
        <label style="margin:0">
          <span id="la">Atos</span> (<span id="cn">1</span>)
        </label>
        <div class="r">
          <button id="ad" style="background:#16a34a;color:#fff">+ Ato</button>
          <button id="dl" style="background:#991b1b;color:#fff">X</button>
          <button id="cl" style="background:#450a0a;color:#fff">Limpar</button>
        </div>
      </div>
      <div class="ac" id="ab" style="margin-top:5px"></div>
      <div class="r">
        <div style="flex:1">
          <label id="lt">Nome do Ato</label><input id="t">
        </div>
        <div style="flex:1.5">
          <label id="ln">Nome do Stand</label><input id="n">
        </div>
        <div style="flex:0.5">
          <label id="lu">Aura</label>
          <input type="color" id="au" value="#ef4444"
            style="height:27px;padding:1px">
        </div>
      </div>
      <div class="r">
        <div style="flex:1"><label id="ls">Usuário</label><input id="u"></div>
        <div style="flex:1"><label id="lc">Grito</label><input id="c"></div>
      </div>
      <div class="r">
        <div style="flex:1">
          <label id="li">Imagem</label>
          <input type="file" id="ii" accept="image/*">
        </div>
        <div style="flex:1"><label id="lsub">Sub-Stand</label><input id="sn"></div>
      </div>
      <label id="lb">Habilidade</label>
      <textarea id="a" rows="2"></textarea>
      <label id="lsb">Habilidade Sub-Stand</label>
      <input id="sa">
      <label>Stand Stats</label>
      <div class="st" id="sb"></div>
      <div class="r" style="margin-top:auto;padding-top:8px;flex-wrap:wrap">
        <button id="rn" style="flex:1;background:#7e22ce;color:#fff">Sortear</button>
        <button id="pn" style="flex:1;background:#d97706;color:#fff">PNG</button>
        <button id="pna" style="flex:1;background:#b45309;color:#fff">PNG Todos</button>
        <button id="lk" style="flex:1;background:#0d9488;color:#fff">Link</button>
        <button id="sv" style="flex:1;background:#16a34a;color:#fff">Salvar</button>
        <button id="ld" style="flex:1;background:#2563eb;color:#fff">Carregar</button>
        <input type="file" id="lf" accept=".json" style="display:none">
      </div>
    </div>
    <div class="bx">
      <div style="text-align:center">
        <small id="dt" style="font-weight:bold"></small>
        <h2 id="dn" style="color:var(--c1);font-size:20px">「」</h2>
        <small id="du" style="color:var(--tx);opacity:0.8"></small>
      </div>
      <div class="vs">
        <div class="iw" id="ib">
          <img id="pi">
          <span id="ni" style="font-size:10px;color:var(--tx);opacity:0.6">Sem imagem</span>
        </div>
        <div class="cw">
          <canvas id="cv" width="240" height="240"></canvas>
        </div>
      </div>
      <div class="ab" id="ax">
        <b id="dc" style="color:var(--c1)"></b>
        <p id="da" style="margin-top:3px"></p>
        <div class="sb-box" id="dsBox">
          <b id="dsn" style="color:var(--c2);font-size:11px"></b>
          <p id="dsa" style="font-size:11px;margin-top:2px"></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = i => document.getElementById(i);
const tx = {
  pt: {
    a:'Atos', ad:'+ Ato', cl:'Limpar', t:'Nome do Ato',
    n:'Nome do Stand', au:'Aura', u:'Usuário', up:'Usuário: ',
    i:'Imagem', ni:'Sem imagem', c:'Grito', b:'Habilidade',
    sub:'Sub-Stand', sb:'Habilidade Sub-Stand',
    rn:'Sortear', pna:'PNG Todos', lk:'Link', lkc:'Copiado!',
    sv:'Salvar', ld:'Carregar', err:'Arquivo inválido!',
    bg:'Fundo', pn:'Painel', c1:'Destaque', c2:'Secundária',
    tx:'Texto', bd:'Borda',
    k:['PODER','VELOCIDADE','ALCANCE','PERSISTÊNCIA','PRECISÃO','POTENCIAL'],
    s:['POD','VEL','ALC','PER','PRE','POT']
  },
  en: {
    a:'Acts', ad:'+ Act', cl:'Reset', t:'Act Name',
    n:'Stand Name', au:'Aura', u:'Stand User', up:'User: ',
    i:'Image', ni:'No image', c:'Battle Cry', b:'Ability',
    sub:'Sub-Stand', sb:'Sub-Stand Ability',
    rn:'Random', pna:'PNG All', lk:'Link', lkc:'Copied!',
    sv:'Save', ld:'Load', err:'Invalid file!',
    bg:'Bg', pn:'Panel', c1:'Accent', c2:'Secondary',
    tx:'Text', bd:'Border',
    k:['POWER','SPEED','RANGE','STAMINA','PRECISION','POTENTIAL'],
    s:['PWR','SPD','RNG','STA','PRC','POT']
  }
};
const defTh = {
  bg:'#090710', pn:'#141024', c1:'#facc15',
  c2:'#a78bfa', tx:'#f8fafc', bd:'#3b2868'
};
const mp = {'∞':6.6,S:6,A:5,B:4,C:3,D:2,E:1,'?':0};
const rk = ['?','∞','S','A','B','C','D','E'];
const db = 'sm_v4';
const mk = i => ({
  t:`ACT ${i}`, n:'', c:'', a:'', sn:'', sa:'',
  au:'#ef4444', img:'', s:['?','?','?','?','?','?']
});
let l = 'pt', ac = [mk(1)], c = 0, z = 1, taps = 0;
let th = {...defTh};

function sanAct(x, i) {
  if(!x || typeof x !== 'object') return mk(i+1);
  const st = Array.isArray(x.s) ? x.s.slice(0,6) : [];
  while(st.length < 6) st.push('?');
  return {
    t: String(x.t ?? `ACT ${i+1}`).slice(0,30),
    n: String(x.n ?? '').slice(0,60),
    c: String(x.c ?? '').slice(0,60),
    a: String(x.a ?? '').slice(0,800),
    sn: String(x.sn ?? '').slice(0,60),
    sa: String(x.sa ?? '').slice(0,500),
    au: /^#[0-9a-f]{6}$/i.test(x.au) ? x.au : '#ef4444',
    img: typeof x.img === 'string' && x.img.startsWith('data:image/') ? x.img : '',
    s: st.map(v => rk.includes(v) ? v : '?')
  };
}

function sanTh(t) {
  const res = {...defTh};
  if(t && typeof t === 'object') {
    Object.keys(defTh).forEach(k => {
      if(/^#[0-9a-f]{6}$/i.test(t[k])) res[k] = t[k];
    });
  }
  return res;
}

function applyTh() {
  const r = document.documentElement.style;
  r.setProperty('--bg', th.bg); r.setProperty('--pn', th.pn);
  r.setProperty('--c1', th.c1); r.setProperty('--c2', th.c2);
  r.setProperty('--tx', th.tx); r.setProperty('--bd', th.bd);
  $('thBg').value = th.bg; $('thPn').value = th.pn;
  $('thC1').value = th.c1; $('thC2').value = th.c2;
  $('thTx').value = th.tx; $('thBd').value = th.bd;
  rn();
}

$('thBtn').onclick = () => {
  const b = $('thBar');
  b.style.display = b.style.display === 'none' ? 'flex' : 'none';
};
['Bg','Pn','C1','C2','Tx','Bd'].forEach(k => {
  $('th'+k).oninput = e => {
    th[k.toLowerCase()] = e.target.value;
    applyTh(); ps();
  };
});
$('thRst').onclick = () => { th = {...defTh}; applyTh(); ps(); };

$('logo').onclick = () => {
  taps++;
  if(taps >= 3) {
    const w = $('wmWrap');
    w.style.display = w.style.display === 'none' ? 'inline' : 'none';
    taps = 0;
  }
};

function zm(v) {
  z = Math.min(1.5, Math.max(0.3, +(v.toFixed(2))));
  const e = $('app');
  e.style.transform = `scale(${z})`;
  e.style.width = `${100/z}%`;
  e.style.height = `${100/z}%`;
  $('zv').textContent = `${Math.round(z*100)}%`;
}
$('zo').onclick = () => zm(z-0.1);
$('zi').onclick = () => zm(z+0.1);
$('zr').onclick = () => zm(1);

function ui() {
  const L = tx[l];
  $('lg').textContent = l.toUpperCase();
  $('la').textContent = L.a; $('ad').textContent = L.ad;
  $('cl').textContent = L.cl; $('lt').textContent = L.t;
  $('ln').textContent = L.n; $('lu').textContent = L.au;
  $('ls').textContent = L.u; $('li').textContent = L.i;
  $('ni').textContent = L.ni; $('lc').textContent = L.c;
  $('lb').textContent = L.b; $('lsub').textContent = L.sub;
  $('lsb').textContent = L.sb; $('rn').textContent = L.rn;
  $('pna').textContent = L.pna; $('lk').textContent = L.lk;
  $('sv').textContent = L.sv; $('ld').textContent = L.ld;
  $('ltBg').textContent = L.bg; $('ltPn').textContent = L.pn;
  $('ltC1').textContent = L.c1; $('ltC2').textContent = L.c2;
  $('ltTx').textContent = L.tx; $('ltBd').textContent = L.bd;
  const sb = $('sb');
  sb.replaceChildren();
  L.k.forEach((k,i) => {
    const div = document.createElement('div');
    div.className = 'si';
    const sp = document.createElement('span');
    sp.textContent = k;
    const sel = document.createElement('select');
    sel.id = 's'+i;
    rk.forEach(r => {
      const op = document.createElement('option');
      op.value = r; op.textContent = r;
      sel.appendChild(op);
    });
    sel.onchange = sa;
    div.append(sp, sel);
    sb.appendChild(div);
  });
  ac[c].s.forEach((v,i) => $('s'+i).value = v);
  rn();
}

function ps() {
  try {
    const data = JSON.stringify({l, u:$('u').value, ac, c, th});
    localStorage.setItem(db, data);
  } catch(e) {}
}

function la(i) {
  c = i;
  $('cn').textContent = ac.length;
  const ab = $('ab');
  ab.replaceChildren();
  ac.forEach((x,j) => {
    const btn = document.createElement('button');
    if(j===c) btn.className = 'on';
    btn.textContent = (x.t||`ACT ${j+1}`).toUpperCase();
    btn.onclick = () => la(j);
    ab.appendChild(btn);
  });
  const d = ac[c];
  $('t').value = d.t; $('n').value = d.n;
  $('c').value = d.c; $('a').value = d.a;
  $('sn').value = d.sn || ''; $('sa').value = d.sa || '';
  $('au').value = d.au; $('ii').value = '';
  d.s.forEach((v,j) => $('s'+j).value = v);
  ps(); rn();
}

function sa() {
  const d = ac[c];
  d.t = $('t').value; d.n = $('n').value;
  d.c = $('c').value; d.a = $('a').value;
  d.sn = $('sn').value; d.sa = $('sa').value;
  d.au = $('au').value;
  d.s = tx[l].k.map((_,i) => $('s'+i).value);
  $('ab').children[c].textContent = (d.t||`ACT ${c+1}`).toUpperCase();
  ps(); rn();
}
function wrapLines(x, txt, maxW) {
  const out = [];
  String(txt || '').split('\n').forEach(p => {
    let ln = '';
    p.split(' ').forEach(w => {
      if(!w) return;
      if(x.measureText(ln + w).width > maxW) {
        if(ln) out.push(ln.trim());
        while(x.measureText(w).width > maxW) {
          let k = w.length;
          while(k > 1 && x.measureText(w.slice(0,k)).width > maxW) k--;
          out.push(w.slice(0,k));
          w = w.slice(k);
        }
        ln = w + ' ';
      } else ln += w + ' ';
    });
    if(ln.trim()) out.push(ln.trim());
  });
  return out;
}

function dr(x, cx, cy, mr, d) {
  x.save();
  x.beginPath();
  x.arc(cx, cy, mr + 14, 0, Math.PI * 2);
  x.strokeStyle = th.c1 + '66';
  x.lineWidth = 2; x.stroke();
  x.beginPath();
  x.arc(cx, cy, mr + 10, 0, Math.PI * 2);
  x.setLineDash([4, 4]);
  x.strokeStyle = d.au;
  x.lineWidth = 1.5; x.stroke();
  x.setLineDash([]);
  for(let i=0; i<6; i++) {
    let a = i*Math.PI/3 - Math.PI/2;
    x.beginPath(); x.moveTo(cx, cy);
    x.lineTo(cx + mr*Math.cos(a), cy + mr*Math.sin(a));
    x.strokeStyle = th.tx + '22'; x.stroke();
  }
  x.restore();

  for(let v=1; v<=6; v++) {
    x.beginPath();
    for(let i=0; i<6; i++) {
      let a = i*Math.PI/3 - Math.PI/2, r = (mr/6)*v;
      let px = cx + r*Math.cos(a), py = cy + r*Math.sin(a);
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.closePath();
    x.strokeStyle = v==6 ? th.c1 : th.tx + '33';
    x.lineWidth = v==6 ? 1.5 : 1; x.stroke();
  }
  x.beginPath();
  d.s.forEach((k,i) => {
    let a = i*Math.PI/3 - Math.PI/2, r = (mr/6)*(mp[k]||0);
    let px = cx + r*Math.cos(a), py = cy + r*Math.sin(a);
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  });
  x.closePath();
  x.fillStyle = d.au + '66'; x.fill();
  x.strokeStyle = d.au; x.lineWidth = 2.5; x.stroke();
  x.textAlign = 'center';
  tx[l].s.forEach((k,i) => {
    let a = i*Math.PI/3 - Math.PI/2;
    let lx = cx + (mr+25)*Math.cos(a), ly = cy + (mr+25)*Math.sin(a);
    x.fillStyle = th.tx; x.font = 'bold 9px sans-serif';
    x.fillText(k, lx, ly-5);
    const val = d.s[i];
    x.fillStyle = (val=='S'||val=='∞') ? '#ef4444' : th.c1;
    x.font = '900 13px sans-serif';
    x.fillText(val, lx, ly+9);
  });
}

function rn() {
  const L = tx[l], d = ac[c], tg = (d.t||`ACT ${c+1}`).toUpperCase();
  $('dt').textContent = tg; $('dt').style.color = d.au;
  $('dn').textContent = d.n ? `「${d.n.toUpperCase()}」` : `「${tg}」`;
  $('du').textContent = $('u').value ? `${L.up}${$('u').value}` : '';
  $('dc').textContent = d.c.toUpperCase(); $('da').textContent = d.a;
  $('ax').style.borderColor = d.au;
  const hasSub = !!(d.sn || d.sa);
  $('dsBox').style.display = hasSub ? 'block' : 'none';
  $('dsn').textContent = d.sn ? `SUB-STAND: 「${d.sn.toUpperCase()}」` : '';
  $('dsa').textContent = d.sa || '';
  $('pi').style.display = d.img ? 'block' : 'none';
  $('ni').style.display = d.img ? 'none' : 'block';
  if(d.img) $('pi').src = d.img;
  $('ib').style.borderColor = d.img ? d.au : th.bd;
  $('ib').style.boxShadow = d.img ? `0 0 15px ${d.au}66` : 'none';
  const x = $('cv').getContext('2d');
  x.clearRect(0,0,240,240);
  dr(x, 120, 120, 74, d);
}

function calcCard(x, d) {
  x.font = '13px sans-serif';
  const abL = wrapLines(x, d.a, 530);
  x.font = '12px sans-serif';
  const subL = (d.sn || d.sa) ? wrapLines(x, d.sa, 530) : [];
  const hasSub = !!(d.sn || d.sa);
  const bh = Math.max(70, 34 + abL.length * 17 + (hasSub ? 28 + subL.length * 16 : 0));
  return { abL, subL, hasSub, bh, h: 375 + bh };
}

function drawCard(x, oy, d, idx, im, info) {
  const L = tx[l], tg = (d.t||`ACT ${idx+1}`).toUpperCase();
  const { abL, subL, hasSub, bh, h } = info;
  x.fillStyle = th.bg; x.fillRect(0, oy, 640, h);
  x.strokeStyle = d.au; x.lineWidth = 4; x.strokeRect(8, oy+8, 624, h-16);
  x.textAlign = 'center';
  x.fillStyle = d.au; x.font = 'bold 14px sans-serif'; x.fillText(tg, 320, oy+38);
  x.fillStyle = th.c1; x.font = '900 26px sans-serif';
  x.fillText(d.n ? `「${d.n.toUpperCase()}」` : `「${tg}」`, 320, oy+68);
  x.fillStyle = th.tx; x.font = '14px sans-serif';
  if($('u').value) x.fillText(`${L.up}${$('u').value}`, 320, oy+90);
  x.strokeStyle = th.bd; x.lineWidth = 2; x.strokeRect(40, oy+115, 180, 220);
  if(im) x.drawImage(im, 40, oy+115, 180, 220);
  else { x.fillStyle = th.tx+'88'; x.font = '12px sans-serif'; x.fillText(L.ni, 130, oy+225); }
  dr(x, 440, oy+225, 76, d);
  x.fillStyle = th.pn; x.fillRect(40, oy+355, 560, bh);
  x.fillStyle = d.au; x.fillRect(40, oy+355, 5, bh);
  x.textAlign = 'left';
  x.fillStyle = th.c1; x.font = 'bold 14px sans-serif'; x.fillText(d.c.toUpperCase(), 55, oy+376);
  x.fillStyle = th.tx; x.font = '13px sans-serif';
  let y = oy + 396;
  abL.forEach(ln => { x.fillText(ln, 55, y); y += 17; });
  if(hasSub) {
    y += 8; x.fillStyle = th.c2; x.font = 'bold 12px sans-serif';
    x.fillText(d.sn ? `SUB-STAND: 「${d.sn.toUpperCase()}」` : 'SUB-STAND', 55, y);
    y += 16; x.fillStyle = th.tx; x.font = '12px sans-serif';
    subL.forEach(ln => { x.fillText(ln, 55, y); y += 16; });
  }
  return h;
}

async function exportPng(list) {
  const imgs = await Promise.all(list.map(d => new Promise(res => {
    if(!d.img) return res(null);
    const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = d.img;
  })));
  const tmp = document.createElement('canvas').getContext('2d');
  const infos = list.map(d => calcCard(tmp, d));
  const wmH = $('wm').checked ? 16 : 0;
  const totH = infos.reduce((s, o) => s + o.h, 0) + wmH;
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = totH;
  const x = cv.getContext('2d');
  x.fillStyle = th.bg; x.fillRect(0, 0, 640, totH);
  let curY = 0;
  list.forEach((d, i) => { curY += drawCard(x, curY, d, list.length>1 ? i : c, imgs[i], infos[i]); });
  if($('wm').checked) {
    x.textAlign = 'right'; x.fillStyle = th.tx + '66'; x.font = '10px sans-serif';
    x.fillText('mygamesandsites.github.io/the-best-jojo-stand-maker', 624, totH - 6);
  }
  const a = document.createElement('a'); a.href = cv.toDataURL('image/png');
  const nm = list.length > 1 ? (list[0].n||'stand-all') : (list[0].n||list[0].t||'stand');
  a.download = `${nm.toLowerCase().replace(/\s+/g,'-')}.png`; a.click();
}

function compressImg(src, maxW, q) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxW / img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc);
      cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = () => res('');
    img.src = src;
  });
}
